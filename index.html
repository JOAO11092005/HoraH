<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-K">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conveniência Hora H</title>
    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/estilo.css">
    <link rel="stylesheet" href="./src/css/responsive.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.min.js"
        integrity="sha512-6BTOlkauINO65nLhXhthZMtepgJSghyimIalb+crKRPhvhmsCdnIuGcVbR5/aQY2A+260iC1OPy1oCdB6pSSwQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="shortcut icon" href="./src/img/logo.png" type="image/x-icon">
</head>

<body>
    <div id="overlay" class="overlay"></div>

    <header class="cabecalho">
        <div class="logo"></div>
    </header>

    <div class="carrinhoCheckout">
        <div class="sair" onclick="abreCarrinho('f')">
            <img src="https://cdn-icons-png.flaticon.com/512/483/483366.png" alt="sair" title="Sair">
        </div>
        <h1>Seu carrinho</h1>

        <div class="produtos">
            <p>Seu carrinho está vazio.</p>
        </div>

        <div class="resumo-carrinho">
            <p class="totalAPagar">Total a pagar: R$ <span id="valorTotal">0.00</span></p>
        </div>
        <button class="pagamento">Fazer o Pagamento</button>
    </div>
    <main>

        <div class="filtro">
            <div class="logo-empresa"></div>
            <div class="categorias-bebidas">
                <select id="categoria" class="bebidas">
                    <option value="">Lista de Categorias</option>
                    <option value="cerveja">Cerveja</option>
                    <option value="whisky">Whisky</option>
                    <option value="Energetico">Energético</option>
                    <option value="Refrigerante">Refrigerante</option>
                    <option value="Cachaças">Cachaças</option>
                </select>
            </div>
            <div class="pesquisa">
                <input type="text" id="pesquisa" placeholder="Pesquisar bebida">
                <button title="Pesquise algum produto" id="btnPesquisar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>


            <div class="carrinho" onclick="abreCarrinho('a')">
                <div class="quantidade off">0</div>
                <i class="fa-solid fa-cart-shopping"></i>
            </div>
            <div class="pedidoAdicionado">
                <h2>Pedido Adicionado</h2>
            </div>
        </div>

        <h2 id="cerveja" class="categoria-titulo">Cervejas</h2>
        <div id="cerveja-cards" class="produtos-container"></div>

        <h2 id="refrigerante" class="categoria-titulo">Refrigerantes</h2>
        <div id="refrigerante-cards" class="produtos-container"></div>

        <h2 id="whisky" class="categoria-titulo">Whisky</h2>
        <div id="whisky-cards" class="produtos-container"></div>

        <h2 id="energetico" class="categoria-titulo">Energéticos</h2>
        <div id="energetico-cards" class="produtos-container"></div>

        <h2 id="cachaca" class="categoria-titulo">Cachaças</h2>
        <div id="cachaca-cards" class="produtos-container"></div>
    </main>

    <div id="produtoModal" class="modal">
        <div class="modal-conteudo">
            <span class="modal-fechar" onclick="fecharModalProduto()">&times;</span>
            <div id="modal-img" class="imgProduto"></div>
            <h2 id="modal-nome">Nome do Produto</h2>
            <p id="modal-descricao">Descrição completa do produto aqui.</p>
            <h3 id="modal-valor">R$ 0,00</h3>
            <button id="modal-add-carrinho" class="btn-comprar">Adicionar ao carrinho</button>
        </div>
    </div>


    <script src="./src/js/index.js"></script>
    <script src="./src/js/mobile.js"></script>
    </body>

</html>
