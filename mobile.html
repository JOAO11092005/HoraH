<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conveniência Hora H - Mobile</title>
    <!-- Carrega Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Configuração do Tailwind CSS para usar a fonte Inter e cores personalizadas -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-red': '#EA1D2C', // Cor principal similar ao iFood
                        'primary-green': '#1f8c44', // Cor alternativa
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        #logo{
            width: 100px;
        }
        /* Estilos customizados */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
        }
        /* Contêiner principal para simular o layout de app mobile */
        #app-container {
            max-width: 420px; /* Largura máxima típica de celular */
            margin: 0 auto;
            min-height: 100vh;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            position: relative; /* Para o carrinho flutuante */
        }
        /* Esconde a barra de rolagem horizontal das categorias, mas permite rolar */
        .scroll-x-hidden::-webkit-scrollbar {
            display: none;
        }
        .scroll-x-hidden {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        /* Blur effect para o fundo */
        .blur-active {
            filter: blur(4px);
            pointer-events: none;
            user-select: none;
        }
        /* Modal e Overlay */
        .modal, #carrinhoCheckout {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s;
        }
        #produtoModal-content {
            background-color: white;
            border-radius: 1rem 1rem 0 0;
            animation: slideInUp 0.3s;
        }
        #carrinhoCheckout-content {
            background-color: #f7f7f7;
            border-radius: 1rem 1rem 0 0;
            animation: slideInUp 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideInUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        /* Botão Adicionado */
        .btn-adicionado {
            background-color: #1f8c44; /* Verde primário */
            color: white;
            pointer-events: none; /* Não permite clique novamente */
        }

        /* Estilo do Card de Produto */
        .card-produto .img {
            height: 100px; /* Altura fixa para a imagem */
            width: 100%;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

        const NOME_LOJA = "Conveniência Hora H";
        const WHATSAPP_NUMBER = "5511999998888"; // Substitua pelo seu número

        // --- INICIALIZAÇÃO ---
        document.addEventListener('DOMContentLoaded', () => {
            carregarProdutos();
            adicionaListenersFiltro();
            adicionaListenerPagamento();
            adicionaEventosCarrinho();
            adicionaListenerOverlay();
            adicionaListenerModalCart();

        // --- CARREGAMENTO DE PRODUTOS ---

        function carregarProdutos() {
            const response = PRODUTOS_DATA;

            // Salva todos os produtos em um único array para facilitar a busca/modal
            todosOsProdutos = [
                ...response.cervejas,
                ...response.refrigerantes,
                ...response.whisky,
                ...response.energeticos,
                ...response.cachacas
            ];

            // Renderiza os produtos nas seções corretas
            produtos('cervejas', response.cervejas);
            produtos('refrigerantes', response.refrigerantes);
            produtos('whisky', response.whisky);
            produtos('energeticos', response.energeticos);
            produtos('cachacas', response.cachacas);
        }

        function produtos(tipo, produtoFinal) {
            let container;
            switch (tipo) {
                case 'cervejas': container = cervejasContainer; break;
                case 'refrigerantes': container = refrigerantesContainer; break;
                case 'whisky': container = whiskysContainer; break;
                case 'energeticos': container = energeticosContainer; break;
                case 'cachacas': container = cachacasContainer; break;
                default: return;
            }
            criaCard(container, produtoFinal);
        }

        function criaCard(container, produtoFinal) {
            container.innerHTML = ''; 
            produtoFinal.forEach(resposta => {
                const { id, nome, valor, img, categoria, 'categoria_id': categoriaId } = resposta;

                const itemNoCarrinho = carrinho.find(item => item.id === id);
                const btnClasse = itemNoCarrinho ? 'btn-adicionado' : 'bg-primary-red hover:bg-red-700';
                const btnTexto = itemNoCarrinho ? 'Adicionado' : 'Adicionar';
                const btnDisabled = itemNoCarrinho ? 'disabled' : '';

                const produtoHTML = `
                    <div class="card-produto bg-white rounded-xl shadow-sm overflow-hidden p-3 flex flex-col items-center justify-between transition transform hover:shadow-lg" 
                         data-categoria-raw="${categoriaId}" data-nome="${nome.toLowerCase()}">
                        
                        <div class="clicavel-modal w-full cursor-pointer" onclick="abrirModalProduto(${id})">
                            <div class="img bg-gray-100 rounded-lg" title="${nome}"
                                style="background: url('${img}') center center no-repeat; background-size: contain;"></div>
                            <div class="info-produto pt-2 w-full">
                                <h3 class="nome-produto text-sm font-semibold truncate">${nome}</h3>
                                <p class="categoria text-xs text-gray-500 mb-1">${categoriaId}</p>
                                <h4 class="preco text-lg font-extrabold text-primary-red">R$${valor.toFixed(2).replace('.', ',')}</h4>
                            </div>
                        </div>
                        
                        <button class="btn-comprar w-full mt-2 py-2 text-sm text-white font-bold rounded-lg transition duration-150 ${btnClasse}" 
                                data-id="${id}" ${btnDisabled}>
                            ${btnTexto}
                        </button>
                    </div>
                `;
                container.innerHTML += produtoHTML;
            });

            // Delegação de eventos para botões "Adicionar"
            container.addEventListener('click', (e) => {
                if (e.target && e.target.classList.contains('btn-comprar')) {
                    const id = parseInt(e.target.dataset.id);
                    const produto = todosOsProdutos.find(p => p.id === id);
                    if (produto) {
                        postCarrinho(produto, e.target);
                    }
                }
            });
        }

        // --- LÓGICA DO CARRINHO ---

        function postCarrinho(produto, btnElement) {
            notificacao();

            const itemExistente = carrinho.find(item => item.id === produto.id);

            if (itemExistente) {
                itemExistente.quantidade++;
            } else {
                carrinho.push({ ...produto, quantidade: 1 });
            }

            if (btnElement && !btnElement.classList.contains('btn-adicionado')) {
                btnElement.textContent = 'Adicionado';
                btnElement.classList.remove('bg-primary-red', 'hover:bg-red-700');
                btnElement.classList.add('btn-adicionado');
                btnElement.disabled = true;
            }

            atualizarContadorCarrinho();
        }

        function atualizarContadorCarrinho() {
            const totalItens = carrinho.reduce((acc, item) => acc + item.quantidade, 0);
            
            if (totalItens > 0) {
                carrinhoCount.innerHTML = totalItens;
                carrinhoCount.classList.remove("hidden");
            } else {
                carrinhoCount.innerHTML = '0';
                carrinhoCount.classList.add("hidden");
            }
        }

        function abreCarrinho(response) {
            if (response === 'a') {
                carrinhoCheckout.style.display = 'flex';
                appContainer.classList.add('blur-active');
                overlay.classList.remove('hidden'); // Usa hidden para o Tailwind
                renderizarItensCarrinho(); 
            }
            else if (response === 'f') {
                carrinhoCheckout.style.display = 'none';
                atualizarOverlayEBlur();
            }
        }

        function renderizarItensCarrinho() {
            if (carrinho.length === 0) {
                carrinhoComProdutos.innerHTML = '<p class="text-center text-gray-500 py-10">Seu carrinho está vazio. Adicione um produto!</p>';
                valorTotalElement.textContent = '0,00';
                return;
            }

            carrinhoComProdutos.innerHTML = '';
            let totalGeral = 0;

            carrinho.forEach((item) => {
                const subtotal = item.valor * item.quantidade;
                totalGeral += subtotal;

                carrinhoComProdutos.innerHTML += `
                    <div class="produtoCheckout flex items-center bg-white p-3 rounded-xl shadow-sm" data-id="${item.id}">
                        <div class="w-12 h-12 bg-gray-100 rounded-md mr-3" 
                            style="background: url('${item.img}') center center no-repeat; background-size: contain;"></div>
                        
                        <div class="flex-grow">
                            <h2 class="font-semibold text-gray-800">${item.nome}</h2>
                            <h3 class="preco-item text-primary-red font-bold">R$ ${subtotal.toFixed(2).replace('.', ',')}</h3>
                        </div>

                        <div class="flex items-center space-x-2">
                            <button class="qdButton aumentar p-1 text-primary-red border border-primary-red rounded-full w-6 h-6 flex items-center justify-center font-bold text-lg leading-none transition hover:bg-red-50" data-acao="aumentar">+</button>
                            <div class="quantidadeProduto font-bold text-gray-800">${item.quantidade}</div>
                            <button class="qdButton diminuir p-1 text-primary-red border border-primary-red rounded-full w-6 h-6 flex items-center justify-center font-bold text-lg leading-none transition hover:bg-red-50" data-acao="diminuir">-</button>
                        </div>
                        
                        <button class="remover-produto ml-3 text-gray-400 hover:text-primary-red transition" data-acao="remover" title="Remover">
                             <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                        </button>
                    </div>
                `;
            });

            valorTotalElement.textContent = totalGeral.toFixed(2).replace('.', ',');
        }

        // Delegação de eventos para botões do carrinho
        function adicionaEventosCarrinho() {
            carrinhoComProdutos.addEventListener('click', (e) => {
                const target = e.target.closest('button');
                if (!target || !target.dataset.acao) return;

                const produtoDiv = target.closest('.produtoCheckout');
                const id = parseInt(produtoDiv.dataset.id);
                const acao = target.dataset.acao;

                switch (acao) {
                    case 'aumentar':
                        alterarQuantidade(id, 1);
                        break;
                    case 'diminuir':
                        alterarQuantidade(id, -1);
                        break;
                    case 'remover':
                        removerItemCarrinho(id);
                        break;
                }
            });
        }

        function alterarQuantidade(id, delta) {
            const itemIndex = carrinho.findIndex(item => item.id === id);
            if (itemIndex === -1) return;

            carrinho[itemIndex].quantidade += delta;

            if (carrinho[itemIndex].quantidade <= 0) {
                removerItemCarrinho(id); 
            } else {
                renderizarItensCarrinho(); 
                atualizarContadorCarrinho();
            }
        }

        function removerItemCarrinho(id) {
            carrinho = carrinho.filter(item => item.id !== id);
            
            // Reativa o botão na lista principal
            const btnNaPagina = document.querySelector(`.btn-comprar[data-id="${id}"]`);
            if (btnNaPagina) {
                btnNaPagina.textContent = 'Adicionar';
                btnNaPagina.classList.remove('btn-adicionado');
                btnNaPagina.classList.add('bg-primary-red', 'hover:bg-red-700');
                btnNaPagina.disabled = false;
            }

            renderizarItensCarrinho();
            atualizarContadorCarrinho();
        }


        // --- LÓGICA DE PAGAMENTO (WHATSAPP) ---

        function adicionaListenerPagamento() {
            btnPagamento.addEventListener('click', () => {
                if (carrinho.length === 0) {
                    // Substituir por um modal/mensagem na interface, não use alert()
                    console.error("Seu carrinho está vazio!");
                    return;
                }

                let mensagem = `*Novo Pedido - ${NOME_LOJA}*\n\n`;
                mensagem += "*Resumo do Pedido:*\n";
                let total = 0;

                carrinho.forEach(item => {
                    const subtotal = item.valor * item.quantidade;
                    total += subtotal;
                    mensagem += `------------------------------------\n`;
                    mensagem += `*Produto:* ${item.nome}\n`;
                    mensagem += `*Qtd:* ${item.quantidade}\n`;
                    mensagem += `*Subtotal:* R$ ${subtotal.toFixed(2).replace('.', ',')}\n`;
                });

                mensagem += `------------------------------------\n`;
                mensagem += `*Total do Pedido: R$ ${total.toFixed(2).replace('.', ',')}*\n\n`;
                mensagem += `Gostaria de finalizar este pedido.`;

                const urlWhatsApp = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensagem)}`;
                
                window.open(urlWhatsApp, '_blank');
            });
        }

        // --- LÓGICA DE BUSCA E FILTRO ---

        function adicionaListenersFiltro() {
            btnPesquisar.addEventListener('click', filtrarProdutos);
            inputPesquisa.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') {
                    filtrarProdutos();
                }
            });
            // Delegação de eventos para os botões de categoria
            filtroCategorias.addEventListener('click', (e) => {
                const btn = e.target.closest('.btn-categoria');
                if (btn) {
                    // Remove destaque de todos
                    document.querySelectorAll('.btn-categoria').forEach(b => {
                        b.classList.remove('bg-primary-red', 'text-white');
                        b.classList.add('bg-gray-100', 'text-gray-700');
                    });
                    // Adiciona destaque ao clicado
                    btn.classList.add('bg-primary-red', 'text-white');
                    btn.classList.remove('bg-gray-100', 'text-gray-700');

                    filtrarProdutos(btn.dataset.filter);
                }
            });
        }

        function filtrarProdutos(categoriaSelecionada) {
            const termoBusca = inputPesquisa.value.toLowerCase();
            if (typeof categoriaSelecionada === 'undefined') {
                // Se o filtro não foi passado pelo botão de categoria, use a categoria 'Todas' (vazio)
                categoriaSelecionada = document.querySelector('.btn-categoria.bg-primary-red')?.dataset.filter || "";
            }

            const todosProdutosCards = document.querySelectorAll('.card-produto');
            const titulosCategoria = document.querySelectorAll('.categoria-titulo');

            // Mapeia seções para títulos
            const secoesVisiveis = new Set();

            todosProdutosCards.forEach(card => {
                const nomeProduto = card.dataset.nome;
                const categoriaProduto = card.dataset.categoriaRaw;
                
                const matchBusca = nomeProduto.includes(termoBusca);
                const matchCategoria = (categoriaSelecionada === "" || categoriaSelecionada === categoriaProduto);

                if (matchBusca && matchCategoria) {
                    card.style.display = 'flex';
                    // Adiciona a seção ao set de visíveis
                    secoesVisiveis.add(card.closest('section').querySelector('.categoria-titulo'));
                } else {
                    card.style.display = 'none';
                }
            });

            // Mostra/Esconde títulos
            titulosCategoria.forEach(h2 => {
                h2.style.display = secoesVisiveis.has(h2) ? 'block' : 'none';
            });
        }


        // --- LÓGICA DO MODAL DE PRODUTO E OVERLAY ---

        function abrirModalProduto(id) {
            const produto = todosOsProdutos.find(p => p.id === id);
            if (!produto) return;

            // 1. Salva o ID no próprio modal (CORREÇÃO para o erro anterior)
            produtoModal.querySelector('#produtoModal-content').dataset.currentProductId = id;

            // 2. Atualiza as informações do modal
            modalImg.style.background = `url('${produto.img}') center center no-repeat`;
            modalImg.style.backgroundSize = 'contain';
            modalNome.textContent = produto.nome;
            modalDescricao.textContent = produto.descricao;
            modalValor.textContent = `R$ ${produto.valor.toFixed(2).replace('.', ',')}`;

            // 3. Atualiza o estado do botão
            const itemNoCarrinho = carrinho.find(item => item.id === id);
            if (itemNoCarrinho) {
                modalAddCarrinho.textContent = 'Adicionado';
                modalAddCarrinho.classList.remove('bg-primary-red', 'hover:bg-red-700');
                modalAddCarrinho.classList.add('btn-adicionado');
                modalAddCarrinho.disabled = true;
            } else {
                modalAddCarrinho.textContent = 'Adicionar ao carrinho';
                modalAddCarrinho.classList.add('bg-primary-red', 'hover:bg-red-700');
                modalAddCarrinho.classList.remove('btn-adicionado');
                modalAddCarrinho.disabled = false;
            }

            // 4. Mostra o modal
            produtoModal.style.display = 'flex';
            overlay.classList.remove('hidden');
            appContainer.classList.add('blur-active');
        }

        // Listener permanente para o botão de adicionar no modal
        function adicionaListenerModalCart() {
            modalAddCarrinho.addEventListener('click', () => {
                // Pega o ID que salvamos no modal
                const idContainer = produtoModal.querySelector('#produtoModal-content');
                const id = parseInt(idContainer.dataset.currentProductId);
                if (!id) return; 

                const produto = todosOsProdutos.find(p => p.id === id);
                if (!produto) return;

                // Encontra o botão correspondente na lista principal
                const btnNaPagina = document.querySelector(`.btn-comprar[data-id="${produto.id}"]`);
                
                postCarrinho(produto, btnNaPagina); 
                
                // Atualiza o próprio botão do modal
                modalAddCarrinho.textContent = 'Adicionado';
                modalAddCarrinho.classList.remove('bg-primary-red', 'hover:bg-red-700');
                modalAddCarrinho.classList.add('btn-adicionado');
                modalAddCarrinho.disabled = true;

                // Fecha o modal
                setTimeout(fecharModalProduto, 500); 
            });
        }


        function fecharModalProduto() {
            produtoModal.style.display = 'none';
            atualizarOverlayEBlur();
        }

        // Verifica se algum modal ainda está aberto.
        function atualizarOverlayEBlur() {
            const isCartOpen = (carrinhoCheckout.style.display === 'flex');
            const isModalOpen = (produtoModal.style.display === 'flex');

            if (!isCartOpen && !isModalOpen) {
                overlay.classList.add('hidden');
                appContainer.classList.remove('blur-active');
            }
        }

        function adicionaListenerOverlay() {
            overlay.addEventListener('click', () => {
                if (produtoModal.style.display === 'flex') {
                    fecharModalProduto();
                }
                if (carrinhoCheckout.style.display === 'flex') {
                    abreCarrinho('f');
                }
            });
        }


        // --- FUNÇÕES UTILITÁRIAS ---

        function notificacao() {
            const pedidoAdicionado = document.querySelector('.pedidoAdicionado');
            pedidoAdicionado.classList.remove('hidden');
            pedidoAdicionado.style.display = 'block'; // Usamos block pois hidden é do Tailwind
            setTimeout(() => {
                pedidoAdicionado.style.display = 'none';
                pedidoAdicionado.classList.add('hidden');
            }, 2000);
        }
    </script>
</body>
